openapi: 3.1.0
info:
  title: SwipeShare API
  version: 0.1.0
paths:
  /api/health:
    get:
      summary: Health Check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/listings:
    get:
      summary: List marketplace listings
      description: Returns active listings
      operationId: getListings
      parameters:
        - name: fulfillment
          in: query
          required: false
          description: Only return listings of this type. Default to return both.
          schema:
            $ref: "#/components/schemas/Fulfillment"
        - name: diningHall
          in: query
          required: false
          description: >
            Only return in-person listings whose `diningHalls` includes the
            dining hall with this `name`. Online listings are not filtered by
            it, since the buyer texts the seller what to order and where.
          schema:
            type: string
            example: Downstein
        - name: from
          in: query
          required: false
          description: >
            Only return listings available at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: >
            Only return listings available at or before this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Marketplace listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/listings/{id}:
    get:
      summary: Get a listing
      operationId: getListing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/purchases:
    post:
      summary: Purchase a listing
      operationId: createPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseRequest"
      responses:
        "201":
          description: Purchase created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          description: >
            Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/purchases/{id}:
    parameters:
      - $ref: "#/components/parameters/PurchaseId"
    get:
      summary: Get a purchase
      description: Only the buyer and the seller of the purchase can see it.
      operationId: getPurchase
      responses:
        "200":
          description: The purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "404":
          description: Purchase not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/purchases/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/PurchaseId"
    post:
      summary: Mark a purchase as complete
      description: >
        Called by the buyer after getting swiped in or picking up the order.
        The buyer then pays the seller outside SwipeShare.
      operationId: completePurchase
      responses:
        "200":
          description: The completed purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "404":
          description: Purchase not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The purchase is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/purchases/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PurchaseId"
    post:
      summary: Cancel a purchase
      description: >
        Puts the swipe back on the marketplace: the in-person listing becomes
        active again, or the online listing's `quantity` goes back up by one.
      operationId: cancelPurchase
      responses:
        "200":
          description: The cancelled purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "404":
          description: Purchase not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The purchase is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/dining-halls:
    get:
      summary: List dining halls
      description: NYU dining locations, from Dine On Campus.
      operationId: getDiningHalls
      responses:
        "200":
          description: Dining halls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiningHall"

components:
  parameters:
    PurchaseId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    Health:
      type: object
      required: [status, environment, timestamp]
      properties:
        status: { type: string, enum: [ok] }
        environment: { type: string, example: development }
        timestamp: { type: string, format: date-time }

    UserSummary:
      description: Public info about a user
      type: object
      required: [id, firstName, lastInitial, rating]
      properties:
        id:
          type: string
          example: <uuid>
        firstName:
          type: string
          example: Jane
        lastInitial:
          type: string
          minLength: 1
          maxLength: 1
          example: S
        rating:
          description: Average rating out of 5. `null` if the user has no ratings yet.
          type: [number, "null"]
          minimum: 0
          maximum: 5
          example: 4.9
        avatarUrl:
          type: string
          format: uri
          example: https://picsum.photos/200

    Fulfillment:
      type: string
      enum: [in_person, online]

    PaymentMethod:
      description: >
        How the buyer pays the seller after getting the swipe.
      type: string
      enum: [venmo, zelle, paypal, cash, apple_cash]

    ListingStatus:
      description: Listing status
      type: string
      enum: [active, sold, expired]

    TimeWindow:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    ListingBase:
      type: object
      required:
        [
          id,
          fulfillment,
          seller,
          price,
          paymentMethods,
          windows,
          status,
          createdAt,
        ]
      properties:
        id:
          type: string
          example: <uuid>
        fulfillment:
          $ref: "#/components/schemas/Fulfillment"
        seller:
          $ref: "#/components/schemas/UserSummary"
        price:
          description: Price in cents
          type: integer
          minimum: 0
          example: 850
        paymentMethods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PaymentMethod"
          example: [venmo, zelle, cash]
        windows:
          description: Times when the seller is available.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TimeWindow"
        status:
          $ref: "#/components/schemas/ListingStatus"
        createdAt:
          type: string
          format: date-time

    InPersonListing:
      description: Seller meets the buyer at the dining hall and swipes them in.
      allOf:
        - $ref: "#/components/schemas/ListingBase"
        - type: object
          required: [fulfillment, diningHalls]
          properties:
            fulfillment:
              const: in_person
            diningHalls:
              description: >
                Dining halls the seller can meet at. The buyer picks one when
                purchasing.
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: "#/components/schemas/DiningHall"
            windows:
              description: When the seller is at the dining hall to swipe the buyer in.

    OnlineListing:
      description: >
        Seller places a Grubhub pickup order for the buyer. Grubhub only
        supports ASAP orders, so a buyer can only purchase while one of the
        seller's windows is active.
      allOf:
        - $ref: "#/components/schemas/ListingBase"
        - type: object
          required: [fulfillment, quantity]
          properties:
            fulfillment:
              const: online
            windows:
              description: When the seller can place orders.
            quantity:
              description: Swipes left for sale. Decremented on each purchase.
              type: integer
              minimum: 0
              example: 5
            paymentMethods:
              description: Online payment methods only.
              items:
                not:
                  const: cash
              example: [venmo, zelle]

    Listing:
      oneOf:
        - $ref: "#/components/schemas/InPersonListing"
        - $ref: "#/components/schemas/OnlineListing"
      discriminator:
        propertyName: fulfillment
        mapping:
          in_person: "#/components/schemas/InPersonListing"
          online: "#/components/schemas/OnlineListing"

    DiningHall:
      type: object
      required: [id, name, street, detail, city, zip, lat, lon, image]
      properties:
        id:
          type: string
          example: 5d2faa744198d4072d6457a8
        name:
          type: string
          example: Downstein
        street:
          type: string
          example: 5 University Pl
        detail:
          type: [string, "null"]
          example: "Bldg #11"
        city:
          type: string
          example: New York
        zip:
          type: string
          example: "10003"
        lat:
          type: number
          example: 40.7309551
        lon:
          type: number
          example: -73.9946057
        image:
          type: string
          format: uri

    PurchaseStatus:
      type: string
      enum: [pending, completed, cancelled]

    PurchaseRequest:
      type: object
      required: [listingId]
      properties:
        listingId:
          type: string
          example: <uuid>
        diningHallId:
          description: In-person only
          type: string
          example: 5d2faa744198d4072d6457a8
        meetAt:
          description: In-person only
          type: string
          format: date-time

    PurchaseUser:
      description: >
        The buyer or seller of a purchase, with their phone number so the
        other side can text them. Only visible to the two of them.
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          required: [phone]
          properties:
            phone:
              type: string
              example: 212-555-0101

    Purchase:
      type: object
      required:
        - id
        - listingId
        - fulfillment
        - seller
        - buyer
        - price
        - paymentMethods
        - paymentInfo
        - diningHall
        - meetAt
        - orderNumber
        - status
        - createdAt
      properties:
        id:
          type: string
          example: <uuid>
        listingId:
          type: string
          example: <uuid>
        fulfillment:
          $ref: "#/components/schemas/Fulfillment"
        seller:
          $ref: "#/components/schemas/PurchaseUser"
        buyer:
          $ref: "#/components/schemas/PurchaseUser"
        price:
          description: Price in cents, at the time of purchase
          type: integer
          minimum: 0
          example: 850
        paymentMethods:
          description: The listing's payment methods, at the time of purchase
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
          example: [venmo, zelle, cash]
        paymentInfo:
          description: >
            Free text from the seller on how to pay them, e.g. their Venmo or
            Zelle handle. `null` if they didn't add any.
          type: [string, "null"]
          example: Venmo @jane-s · Zelle 212-555-0101
        diningHall:
          description: In-person, where the buyer and seller meet. `null` for online.
          anyOf:
            - $ref: "#/components/schemas/DiningHall"
            - type: "null"
        meetAt:
          description: >
            In-person: when the buyer and seller meet at `diningHall`. `null`
            for online.
          type: [string, "null"]
          format: date-time
        orderNumber:
          description: >
            Online: the Grubhub order number, set by the seller after placing
            the order. The buyer gives it and the seller's name at pickup.
            `null` until then, and always `null` for in-person.
          type: [string, "null"]
          example: "4821"
        status:
          $ref: "#/components/schemas/PurchaseStatus"
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Invalid `diningHall`: dining hall not found"
